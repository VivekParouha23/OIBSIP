<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<aside><p class="mark">Keyhole</p><h2>Your things, behind one door.</h2><p>Sign in to see your dashboard. Your password never leaves this device in plain text.</p></aside>
<main class="box">
  <h1>Login</h1>
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="go">Login</button>
  <p id="msg" class="msg" role="alert"></p>
  <p class="alt"><a href="register.html">New here? Register</a></p>
</main>
<script src="auth.js"></script>
<script>
document.getElementById('go').addEventListener('click', async () => {
  const msg = document.getElementById('msg');
  const err = await login(email.value, pw.value);
  if (err) { msg.className = 'msg'; msg.textContent = err; return; }
  location.href='dashboard.html';
});
</script>
</body>
</html>
